<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0a111c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>DENIX D — Online Arena</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header><div class="brand"><span class="logo">D</span><div><b>DENIX D</b><small>ONLINE ARENA · PROTOTYPE</small></div></div><div class="connection"><i id="dot"></i><span id="status">Connecting…</span></div></header>
<section class="hud"><div class="stat"><small>YOUR HEALTH</small><div class="health"><span id="healthbar"></span></div><b id="hp">100 HP</b></div><div class="stat"><small>ELIMINATIONS</small><b id="score">0</b></div><div class="stat"><small>PLAYERS ONLINE</small><b id="count">1</b></div></section>
<main><canvas id="game" aria-label="DENIX D game arena"></canvas><div class="tip" id="tip">Move: WASD / arrow keys · Aim: mouse · Fire: click or Space</div><div class="feed" id="feed"></div><div class="mobile-controls"><div class="dpad"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div><button id="fire" class="fire">FIRE</button></div><div class="dead hidden" id="dead"><h2>ELIMINATED</h2><p>Jump back into the arena.</p><button id="respawn">RESPAWN</button></div></main>
<footer><span>DENIX D · Build your legend</span><span>Prototype v0.1 · Original game concept</span></footer></div><script src="server-config.js"></script><script src="game.js"></script></body></html>
